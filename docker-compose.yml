version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: letsgoplay-postgres
    environment:
      POSTGRES_DB: letsgoplay
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: letsgoplay-redis
    ports:
      - "6379:6379"

volumes:
  pg_data:
